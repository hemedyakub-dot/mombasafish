<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-labelledby="st sd">
<title id="st">Babu Samaki rowing his mtumbwi</title>
<desc id="sd">An elder fisherman in a kofia paddling a hand-carved mango-wood dugout canoe on calm water at dawn.</desc>
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
@keyframes row{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes lean{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
.boat{animation:bob 3.4s ease-in-out infinite;transform-origin:center}
.oar{animation:row 3.4s ease-in-out infinite;transform-origin:212px 170px}
.man{animation:lean 3.4s ease-in-out infinite;transform-origin:center}
.wav{animation:drift 9s linear infinite}
@media(prefers-reduced-motion:reduce){.boat,.oar,.man,.wav{animation:none}}
</style>
<circle cx="320" cy="46" r="26" fill="#FFB84D" opacity=".85"/>
