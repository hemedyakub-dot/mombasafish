    return '<section class="wt-card wt-map"><h2>Where your consignment is</h2>' + svg + '<p class="wt-mapcap">' + cap + '</p>' +
      '<ul class="wt-mapkey"><li><svg width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" transform="rotate(45 6 6)" fill="#FFB84D"/></svg>Our hub</li>' +
      '<li><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#032A2E" stroke-width="2.5"/></svg>Your town</li>' +
      '<li><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5.5" fill="#07474C"/></svg>Last confirmed place</li></ul>' +
      '<p class="wh-hint">The pin shows the last place our team confirmed with the carrier. It is not live GPS and does not move between updates.' +
      (m.dest.approx ? ' Your town is not on our map list, so we show the ' + esc(m.dest.county) + ' County centre.' : '') + '</p></section>';
  }

  var box = document.getElementById('wt');
  var m = location.pathname.match(/\/track\/([0-9a-fA-F]{32})\/?$/) || location.search.match(/[?&]t=([0-9a-fA-F]{32})/);
  var token = m ? m[1].toLowerCase() : null;
  var timer = null, busy = false, last = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(n){ return Number(n || 0).toLocaleString('en-KE', {maximumFractionDigits: 2}); }
  function kes(n){ return 'KES ' + num(n); }
  function when(t, withTime){
    if (!t) return '';
    var d = new Date(t); if (isNaN(d)) return esc(t);
    var o = {timeZone: 'Africa/Nairobi', day: 'numeric', month: 'short', year: 'numeric'};
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return d.toLocaleString('en-KE', o);
  }
  function rpc(fn, body){
    return fetch(SB + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: {'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(j){ if (!r.ok) throw new Error((j && j.message) || 'Something went wrong.'); return j; });
    }, function(){ throw new Error('offline'); });
  }

  function steps(o){
    var dead = o.cancelled || o.declined;
    return '<ol class="wt-steps">' + STEPS.map(function(label, i){
      var n = i + 1, cls = dead ? 'todo' : (n < o.stage || o.stage === 10 ? 'done' : (n === o.stage ? 'now' : 'todo'));
      return '<li class="' + cls + '"><span class="wt-dot">' + (cls === 'done' ? '&#10003;' : n) + '</span><div><b>' + esc(label) + '</b>' +
        (cls === 'now' ? '<small>Current stage</small>' : '') + '</div></li>';
    }).join('') + '</ol>';
  }

  function quoteCard(o){
    var q = o.quote; if (!q) return '';
    var rows = (q.lines || []).map(function(l){
      return '<tr><td>' + esc(l.product) + '</td><td>' + num(l.kg) + ' kg</td><td>' + kes(l.price_per_kg) + '</td><td>' + kes(l.value != null ? l.value : l.kg * l.price_per_kg) + '</td></tr>';
    }).join('');
    var h = '<section class="wt-card wt-quote"><h2>Quotation ' + (q.version > 1 ? '(version ' + q.version + ')' : '') + '</h2>' +
      '<div class="wt-tablewrap"><table class="wt-table"><thead><tr><th>Product</th><th>Quantity</th><th>Price</th><th>Value</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p>Goods ' + kes(q.goods_kes) + ' · Transport ' + kes(q.transport_kes) + '</p>' +
      '<p class="wt-total">Total ' + kes(q.total_kes) + '</p>' +
      (q.note ? '<p>' + esc(q.note) + '</p>' : '');
    if (q.status === 'issued' && !q.expired && !o.cancelled) {
      h += '<p class="wh-hint">Valid until ' + when(q.valid_until) + '. Accepting confirms the order; payment comes next.</p>' +
        '<label class="wh-hint" for="wtNote">Message to us (optional)</label><textarea id="wtNote" maxlength="500" rows="2"></textarea>' +
        '<div class="btns"><button class="btn btn-coral btn-sm" data-q="accept" data-id="' + q.id + '">Accept quotation</button>' +
        '<button class="btn wt-ghost btn-sm" data-q="decline" data-id="' + q.id + '">Decline</button></div>' +
        '<p class="wt-err" id="wtQErr" hidden></p>';
    } else if (q.status === 'issued' && q.expired) {
      h += '<div class="wt-banner info">This quotation expired on ' + when(q.valid_until) + '. Message us for a fresh one.</div>';
    } else if (q.status === 'accepted') {
      h += '<p><b>You accepted this quotation.</b></p>';
      if (o.payment_status !== 'paid') {
        h += '<div class="wt-pay"><p><b>How to pay</b></p><p>Lipa na M-Pesa · Buy Goods Till</p><p class="till">' + TILL + '</p>' +
          '<p>' + TILL_NAME + ' · Amount ' + kes(q.total_kes) + (o.payment_status === 'part_paid' ? ' (part already received)' : '') + '</p>' +
          '<p class="wh-hint">Then send the M-Pesa message with your reference ' + esc(o.ref) + ' to WhatsApp 0787 668 888. Payment shows here once we confirm it.</p></div>';
      }
    } else if (q.status === 'declined') {
      h += '<p><b>You declined this quotation.</b> Message us if you would like another.</p>';
    }
    return h + '</section>';
  }

  function render(o){
    last = o;
    var st = STATUS[o.status] || [o.status, ''];
    var pay = '';
    if (o.payment_status === 'paid') pay = '<span class="wt-pill good">Payment confirmed</span>';
    else if (o.payment_status === 'part_paid') pay = '<span class="wt-pill warn">Part paid</span>';
    else if (o.payment_status === 'refunded') pay = '<span class="wt-pill">Refunded</span>';
    else if (['quote_accepted','confirmed','processing','ready','dispatched','delivered'].indexOf(o.status) >= 0) pay = '<span class="wt-pill warn">Payment pending</span>';   // delivered on credit still owes
    var h = '<section class="wt-card wt-head"><span class="kick">Wholesale consignment</span><p class="wt-ref">' + esc(o.ref) + '</p>' +
      '<div class="wt-pills"><span class="wt-pill ' + st[1] + '">' + esc(st[0]) + '</span>' + pay + '</div>' +
      '<dl class="wt-facts"><div><dt>Ordered</dt><dd>' + when(o.ordered_on) + '</dd></div>' +
      '<div><dt>' + (o.delivery_mode === 'collection' ? 'Buyer in' : 'Going to') + '</dt><dd>' + esc(o.destination) + '</dd></div>' +
      '<div><dt>Type</dt><dd>' + (o.kind === 'quote' ? 'Quotation request' : 'Order at listed prices') + '</dd></div>' +
      '<div><dt>Stage</dt><dd>' + esc(o.stage_label) + '</dd></div></dl></section>';

    if (o.cancelled) h += '<div class="wt-banner bad">This order was cancelled. Message us on WhatsApp if you have questions.</div>';
    if (o.declined) h += '<div class="wt-banner bad">This quotation was declined, so the order is closed.</div>';

    h += quoteCard(o);
    h += mapCard(o);
    h += '<section class="wt-card' + (o.cancelled || o.declined ? ' wt-dim' : '') + '"><h2>Progress</h2>' + steps(o) + '</section>';

    var qty = (o.lines || []).map(function(l){
      var cell = function(label, v, cls){ return '<div class="' + (cls || '') + '"><dt>' + label + '</dt><dd>' + v + '</dd></div>'; };
      var part = Number(l.outstanding_kg) > 0 && Number(l.dispatched_kg) > 0;
      return '<div class="wt-qline"><b>' + esc(l.product) + '</b><dl class="wt-qgrid">' +
        cell('Requested', num(l.requested_kg) + ' kg') +
        cell('Confirmed', l.confirmed_kg == null ? 'Not yet' : num(l.confirmed_kg) + ' kg') +
        cell('Prepared', num(l.prepared_kg) + ' kg') +
        cell('Dispatched', num(l.dispatched_kg) + ' kg') +
        cell('Delivered', num(l.delivered_kg) + ' kg') +
        cell('Still to send', num(l.outstanding_kg) + ' kg', part ? 'out' : '') + '</dl></div>';
    }).join('');
    h += '<section class="wt-card"><h2>Quantities</h2>' + qty + '</section>';

    if (o.shipments && o.shipments.length) {
      h += '<section class="wt-card"><h2>Shipments</h2>' + o.shipments.map(function(s){
        return '<div class="wt-ship"><div class="r1"><b>' + esc(s.ref) + '</b><span class="wt-pill ' + (s.status === 'delivered' ? 'good' : s.status === 'delayed' ? 'warn' : 'neutral') + '">' + esc(SHIP[s.status] || s.status) + '</span></div>' +
          '<div>' + num(s.kg) + ' kg · ' + esc(MODE[s.mode] || s.mode) + (s.dispatched_at ? ' · left Shimoni ' + when(s.dispatched_at, true) : '') + '</div>' +
          (s.eta && s.status !== 'delivered' ? '<div>Expected ' + when(s.eta) + '</div>' : '') +
          (s.delivered_at ? '<div>Delivered ' + when(s.delivered_at, true) + '</div>' : '') +
          (s.last_location ? '<div class="loc">Last confirmed: ' + esc(s.last_location) + (s.last_location_at ? ', ' + when(s.last_location_at, true) : '') + '</div>' : '') +
          '</div>';
      }).join('') + '<p class="wh-hint">Locations are confirmed by our team with the carrier. We do not use live GPS, so the last confirmed point is shown.</p></section>';
    }

    var log = (o.timeline || []).slice().reverse();
    if (log.length) h += '<section class="wt-card"><h2>Updates</h2><ul class="wt-log">' + log.map(function(e){
      return '<li><time>' + when(e.at, true) + '</time><span>' + esc(e.text) + '</span></li>'; }).join('') + '</ul></section>';

    h += '<div class="wt-help"><a class="btn btn-wa btn-sm" href="https://wa.me/' + WA + '?text=' + encodeURIComponent('Hello MombasaFish, about my wholesale order ' + o.ref + '.') + '">Ask about this order</a></div>' +
      '<p class="wt-meta" id="wtMeta">' + metaText() + '</p>';
    var note = document.getElementById('wtNote'), keep = note ? note.value : '';
    box.innerHTML = h;
    var n2 = document.getElementById('wtNote'); if (n2 && keep) n2.value = keep;
  }

  function metaText(){
    return 'Checked ' + new Date().toLocaleTimeString('en-KE', {timeZone: 'Africa/Nairobi', hour: '2-digit', minute: '2-digit', second: '2-digit'}) +
      ' · this page updates by itself every ' + (POLL_MS / 1000) + ' seconds';
  }
  function setPace(o){
    var want = (o.shipments || []).some(function(s){ return ONROAD.indexOf(s.status) >= 0; }) ? 15000 : 30000;
    if (want !== POLL_MS) { POLL_MS = want; clearInterval(timer); timer = setInterval(load, POLL_MS); }
  }
  var lastJson = null;
  function show(o){
    setPace(o);
    var j = JSON.stringify(o);
    if (j === lastJson) { var mt = document.getElementById('wtMeta'); if (mt) mt.textContent = metaText(); return; }
    lastJson = j; render(o);
  }

  function fatal(msg){
    box.innerHTML = '<section class="wt-card"><h2>We could not open this tracking link</h2><p class="wt-err">' + esc(msg) + '</p>' +
      '<p>Check that you copied the whole link. For shop and home-delivery orders use the <a href="/track">order tracker</a>.</p>' +
      '<div class="wt-help"><a class="btn btn-wa btn-sm" href="https://wa.me/' + WA + '">Message us on WhatsApp</a><a class="btn wt-ghost btn-sm" href="/wholesale">Wholesale home</a></div></section>';
  }

  function load(){
    if (busy || document.hidden) return;
    busy = true;
    rpc('mfm_w_track', {p_token: token}).then(show).catch(function(e){
      if (e.message === 'offline') {
        if (last) { var mt = document.getElementById('wtMeta'); if (mt) mt.textContent = 'No connection — showing the last update. Retrying…'; }
        else fatal('We could not reach our system. Check your connection and refresh.');
      } else { clearInterval(timer); fatal(e.message); }
    }).then(function(){ busy = false; });
  }

  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-q]'); if (!b) return;
    var accept = b.getAttribute('data-q') === 'accept';
    if (!b.dataset.sure) {
      b.dataset.sure = '1';
      b.textContent = accept ? 'Tap again to confirm acceptance' : 'Tap again to decline';
      return;
    }
    var note = (document.getElementById('wtNote') || {}).value || null;
    box.querySelectorAll('[data-q]').forEach(function(x){ x.disabled = true; });
    rpc('mfm_w_respond_quote', {p_token: token, p_quote_id: Number(b.getAttribute('data-id')), p_accept: accept, p_note: note})
      .then(show).catch(function(err){
        var q = document.getElementById('wtQErr'); if (q) { q.textContent = err.message === 'offline' ? 'No connection. Try again.' : err.message; q.hidden = false; }
        box.querySelectorAll('[data-q]').forEach(function(x){ x.disabled = false; });
      });
  });

  if (!token) { fatal('This link is missing its tracking code.'); return; }
  load();
  timer = setInterval(load, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
<script src="/ui.js" defer></script>
</body>
</html>
