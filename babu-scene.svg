<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-labelledby="st sd">
<title id="st">Babu Samaki waving</title>
<desc id="sd">An elder fisherman in an embroidered kofia sits on a carved Swahili kiti cha enzi by the shore, a walking stick in one hand, waving hello with the other, an empty stool set out beside him. Gulls turn overhead and two dolphins break the water offshore.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7E3C4"/><stop offset="0.55" stop-color="#F2EDE3"/><stop offset="1" stop-color="#DCEDE6"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A5C63"/><stop offset="1" stop-color="#07474C"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E8D9BE"/><stop offset="1" stop-color="#DCC9A8"/>
  </linearGradient>
  <clipPath id="frame"><rect width="400" height="210" rx="12"/></clipPath>
</defs>
<style>
  @keyframes bswave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
  @keyframes bsshim{0%,100%{opacity:.30}50%{opacity:.60}}
  @keyframes bsdhow{0%{transform:translateX(0)}100%{transform:translateX(26px)}}
  @keyframes bsleap{0%,100%{transform:translateY(6px)}45%{transform:translateY(-7px)}}
  @keyframes bsleap2{0%,100%{transform:translateY(4px)}55%{transform:translateY(-5px)}}
  @keyframes bsfly{0%{transform:translateX(0)}100%{transform:translateX(30px)}}
  @keyframes bsflap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
  .wavearm{transform-origin:227px 116px;animation:bswave 1.9s ease-in-out infinite}
  .shim{animation:bsshim 4.2s ease-in-out infinite}
  .dhow{animation:bsdhow 26s linear infinite alternate}
  .dolphin{transform-origin:center;animation:bsleap 5.2s ease-in-out infinite}
  .dolphin2{transform-origin:center;animation:bsleap2 5.2s ease-in-out infinite .7s}
  .birds{animation:bsfly 30s ease-in-out infinite alternate}
  .flap{transform-origin:center;animation:bsflap 1.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){
    .wavearm{animation:none;transform:rotate(6deg)}
    .shim,.dhow,.dolphin,.dolphin2,.birds,.flap{animation:none}
  }
</style>

<g clip-path="url(#frame)">
  <rect width="400" height="210" fill="url(#sky)"/>
  <circle cx="322" cy="46" r="19" fill="#FFB84D" opacity=".55"/>

  <!-- sea -->
  <rect y="96" width="400" height="56" fill="url(#sea)"/>
  <g class="dhow" opacity=".55">
    <path d="M56 94l13-22 3 22z" fill="#032A2E"/>
    <path d="M50 94h26l-4 5H54z" fill="#032A2E"/>
  </g>
  <g class="shim" fill="#7FD4C1">
    <rect x="24" y="106" width="42" height="2" rx="1"/>
    <rect x="96" y="118" width="60" height="2" rx="1"/>
    <rect x="270" y="110" width="52" height="2" rx="1"/>
    <rect x="316" y="130" width="40" height="2" rx="1"/>
    <rect x="60" y="138" width="34" height="2" rx="1"/>
  </g>


  <!-- gulls -->
  <g class="birds" fill="none" stroke="#5C7C7A" stroke-width="2" stroke-linecap="round" opacity=".75">
    <g class="flap"><path d="M96 34c4-5 8-5 11 0"/><path d="M107 34c3-5 7-5 11 0"/></g>
    <g class="flap" style="animation-delay:.4s"><path d="M136 22c3-4 6-4 8 0"/><path d="M144 22c2-4 5-4 8 0"/></g>
    <g class="flap" style="animation-delay:.8s"><path d="M74 50c2-3 5-3 7 0"/><path d="M81 50c2-3 4-3 6 0"/></g>
  </g>

  <!-- dolphins leaving the water -->
  <g class="dolphin">
    <g transform="translate(288,104) scale(0.95) rotate(-38 20 20)" fill="#0B2E31">
      <ellipse cx="20" cy="20" rx="17" ry="6.2"/>
      <path d="M36 18.5l8-1.5-8-3z"/>
      <path d="M18 14.2l3.5-9.5 3.5 9z"/>
      <path d="M4 20l-9-6.5 1 13z"/>
      <path d="M20 25.5l-2 6 6-4z"/>
    </g>
    <ellipse cx="292" cy="140" rx="14" ry="3" fill="#7FD4C1" opacity=".5"/>
  </g>

  <g class="dolphin2">
    <g transform="translate(334,118) scale(0.62) rotate(-32 20 20)" fill="#0B2E31" opacity=".9">
      <ellipse cx="20" cy="20" rx="17" ry="6.2"/>
      <path d="M36 18.5l8-1.5-8-3z"/>
      <path d="M18 14.2l3.5-9.5 3.5 9z"/>
      <path d="M4 20l-9-6.5 1 13z"/>
    </g>
    <ellipse cx="337" cy="144" rx="9" ry="2.5" fill="#7FD4C1" opacity=".45"/>
  </g>

  <!-- shore -->
  <path d="M0 150c60-6 120 4 200 0s140-8 200-2v62H0z" fill="url(#sand)"/>
  <path d="M0 150c60-6 120 4 200 0s140-8 200-2" fill="none" stroke="#F2EDE3" stroke-width="2.5" opacity=".8"/>


  <!-- kigoda: a low Swahili stool, empty, pulled out for whoever arrives -->
  <ellipse cx="292" cy="196" rx="34" ry="6" fill="#C4AC86" opacity=".45"/>
  <g>
    <path d="M270 176l6 20h5l-4-20zM314 176l-6 20h-5l4-20z" fill="#3A2418"/>
    <path d="M290 178v18h5v-18z" fill="#4A2E1B"/>
    <path d="M262 170h60c2 0 3 1 3 3l-2 5c-1 2-2 3-4 3h-54c-2 0-3-1-4-3l-2-5c0-2 1-3 3-3z" fill="#4A2E1B"/>
    <ellipse cx="292" cy="170" rx="31" ry="9" fill="#6B4423"/>
    <ellipse cx="292" cy="169" rx="26" ry="7" fill="#C9A874"/>
    <g stroke="#A98756" stroke-width="1.2" opacity=".7">
      <path d="M270 169h44M276 165h32M276 173h32"/>
    </g>
    <ellipse cx="292" cy="169" rx="26" ry="7" fill="none" stroke="#5A3A20" stroke-width="1.6"/>
  </g>

  <!-- kiti cha enzi: the carved Swahili chair -->
  <g fill="#4A2E1B">
    <rect x="168" y="58" width="7" height="96" rx="3"/>
    <rect x="231" y="58" width="7" height="96" rx="3"/>
    <rect x="168" y="58" width="70" height="7" rx="3"/>
    <rect x="168" y="76" width="70" height="4" rx="2"/>
    <rect x="168" y="140" width="70" height="5" rx="2"/>
    <circle cx="171.5" cy="55" r="4"/><circle cx="234.5" cy="55" r="4"/>
  </g>
  <!-- woven back panel -->
  <g stroke="#C9A874" stroke-width="2" opacity=".85">
    <path d="M176 86v50M186 86v50M196 86v50M206 86v50M216 86v50M226 86v50"/>
    <path d="M172 96h62M172 110h62M172 124h62" opacity=".6"/>
  </g>
  <ellipse cx="203" cy="193" rx="52" ry="7" fill="#C4AC86" opacity=".4"/>
  <!-- seat and legs -->
  <rect x="160" y="152" width="86" height="9" rx="4" fill="#3A2418"/>
  <rect x="164" y="161" width="7" height="30" rx="3" fill="#3A2418"/>
  <rect x="235" y="161" width="7" height="30" rx="3" fill="#3A2418"/>

  <!-- ===== Babu ===== -->
  <!-- legs -->
  <path d="M186 152c-2 14-4 22-6 30l14 2c3-10 5-18 6-30z" fill="#3C6E74"/>
  <path d="M206 152c1 13 2 22 4 30l14-1c-2-11-4-19-5-29z" fill="#356168"/>
  <path d="M176 186h20v6h-22z" fill="#2A1A12"/><path d="M208 187h20v6h-22z" fill="#2A1A12"/>

  <!-- kanzu -->
  <path d="M180 116c-4 12-5 26-5 38h52c0-13-1-27-5-38-4-9-11-13-21-13s-17 4-21 13z" fill="#EFE7D8"/>
  <path d="M196 106c3 6 5 9 7 12 2-3 4-6 7-12" fill="none" stroke="#D3C6AE" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M186 122c-1 10-1 20-1 30" stroke="#D3C6AE" stroke-width="2" fill="none"/>

  <!-- stick arm (his right, our left) -->
  <path d="M182 116c-8 5-13 16-15 26" stroke="#8A5A3B" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="167" cy="145" r="6" fill="#8A5A3B"/>
  <path d="M160 122c-1 24-2 48-3 68" stroke="#6B4423" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M160 122c0-5 5-8 9-6" stroke="#6B4423" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- waving arm (his left, our right) -->
  <g class="wavearm">
    <path d="M224 118c8-2 15-8 19-16" stroke="#8A5A3B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="246" cy="98" r="7.5" fill="#8A5A3B"/>
    <g stroke="#8A5A3B" stroke-width="3" stroke-linecap="round">
      <path d="M243 92v-7"/><path d="M247 91v-8"/><path d="M251 92v-6"/>
    </g>
  </g>

  <!-- head -->
  <path d="M197 100h12v9h-12z" fill="#6E4429"/>
  <circle cx="203" cy="88" r="17" fill="#8A5A3B"/>
  <!-- beard: follows the jaw, leaves the cheeks and mouth clear -->
  <path d="M189 91c0 10 5 18 14 18s14-8 14-18c-3 5-7 8-14 8s-11-3-14-8z" fill="#D9D5CC"/>
  <path d="M189 91c0 10 5 18 14 18s14-8 14-18c-2 3-4 5-6 6-2 5-4 8-8 8s-6-3-8-8c-2-1-4-3-6-6z" fill="#C6C1B6" opacity=".55"/>
  <path d="M195 86a2.4 2.4 0 1 1 0 .1M211 86a2.4 2.4 0 1 1 0 .1" fill="#1A1008"/>
  <path d="M190 80c3-2 6-2 8-1M208 79c3-1 6-1 8 1" stroke="#5C3A22" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M199 97c2.5 2 5.5 2 8 0" stroke="#5C3A22" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <path d="M196 94c3-2 5-2 7-2s4 0 7 2c-2 1-5 1.5-7 1.5s-5-.5-7-1.5z" fill="#E4E0D8"/>
  <!-- kofia -->
  <path d="M186 76c0-11 8-17 17-17s17 6 17 17z" fill="#F7F3EA"/>
  <rect x="185" y="74" width="36" height="6" rx="3" fill="#EDE6D6"/>
  <g fill="#0A5C63" opacity=".75">
    <circle cx="194" cy="70" r="1.5"/><circle cx="203" cy="67" r="1.5"/><circle cx="212" cy="70" r="1.5"/>
    <circle cx="198" cy="63" r="1.2"/><circle cx="208" cy="63" r="1.2"/>
  </g>
</g>
</svg>
